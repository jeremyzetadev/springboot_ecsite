<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeLeaf.org"> <!-- th:replace="base::Layout(content)" -->
<head>
    <link rel="stylesheet" href="/css/style.css">
    <link th:replace="~{base::bootstrap}" rel="stylesheet" href="">
    <link th:replace="~{base::fontawesome}" rel="stylesheet" href="">
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<nav th:replace="~{base::nav}"></nav>

<section>
    <div class="container-fluid mt-5 p-5">
        <div class="card card-sh">
            <div class="card-header text-center">
                <p class="fs-4">Users</p>
                <th:block th:if="${session.succMsg}">
                    <p class="text-success fw-bold">[[${session.succMsg}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                    <!-- commonServiceImpl c is lower case-->
                    <!-- <th:block th:text="${@CommonServiceImpl.removeSessionMessage()}"></th:block> -->
                </th:block>
                <th:block th:if="${session.errorMsg}">
                    <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                    <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                    <!-- commonServiceImpl c is lower case-->
                    <!-- <th:block th:text="${@CommonServiceImpl.removeSessionMessage()}"></th:block> -->
                </th:block>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th scope="col">Sl No</th>
                        <th scope="col">Profile</th>
                        <th scope="col">Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Mobile Number</th>
                        <th scope="col">Address</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u,c:${users}">
                        <th scope="row">[[${c.count}]]</th>
                        <td><img th:src="@{'/img/product_img/' + ${u.profileImage}}" width="100px" height="100xp"></td>
                        <td>[[${u.name}]]</td>
                        <td>[[${u.email}]]</td>
                        <td>[[${u.mobileNumber}]]</td>
                        <td>[[${u.address + ',' + u.city + ',' + u.state + ',' +u.pincode}]]</td>
                        <td>[[${u.isEnable}]]</td>
                        <td>
                            <a th:href="@{'/admin/updateStatus?status=true&id=' + ${u.id}}" class="btn btn-sm btn-primary"><i class="fa-solid fa-pen-to-square"></i>Active</a>
                            <a th:href="@{'/admin/updateStatus?status=false&id=' + ${u.id}}" class="btn btn-sm btn-primary"><i class="fa-solid fa-pen-to-square"></i>Inactive</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</section>

<div th:replace="~{base::footer}"></div>
</body>
<script th:replace="~{base::jsb1}"></script>
</html>

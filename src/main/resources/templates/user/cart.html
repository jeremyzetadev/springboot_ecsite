<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeLeaf.org"> <!-- th:replace="base::Layout(content)" -->
<head>
  <link rel="stylesheet" href="/css/style.css">
  <link th:replace="~{base::bootstrap}" rel="stylesheet" href="">
  <link th:replace="~{base::fontawesome}" rel="stylesheet" href="">
  <meta charset="UTF-8">
  <title>Products</title>
</head>
<body>
<nav th:replace="~{base::nav}"></nav>

<section>
  <div class="container-fluid mt-5 p-5">
    <div class="card card-sh">
      <div class="card-header text-center">
        <p class="fs-4">Cart Page</p>
        <th:block th:if="${session.succMsg}">
          <p class="text-success fw-bold">[[${session.succMsg}]]</p>
          <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
          <!-- commonServiceImpl c is lower case-->
          <!-- <th:block th:text="${@CommonServiceImpl.removeSessionMessage()}"></th:block> -->
        </th:block>
        <th:block th:if="${session.errorMsg}">
          <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
          <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
          <!-- commonServiceImpl c is lower case-->
          <!-- <th:block th:text="${@CommonServiceImpl.removeSessionMessage()}"></th:block> -->
        </th:block>
      </div>
      <div class="card-body">
        <table class="table">
          <thead>
          <tr>
            <th scope="col">Sl No</th>
            <th scope="col">Image</th>
            <th scope="col">Product Name</th>
            <th scope="col">Price</th>
            <th scope="col" class="text-center">Quantity</th>
            <th scope="col">Total Price</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="cart,c:${carts}">
            <th scope="row">[[${c.count}]]</th>
            <td><img th:src="@{'/img/product_img/' + ${cart.product.image}}" width="100px" height="100xp"></td>
            <td>[[${cart.product.title}]]</td>
            <td>[[${cart.product.discountPrice}]]</td>
            <td class="text center">
              <a th:href="@{'/user/cartQuantityUpdate?symbol=decrease&cid='+${cart.id}}">
                <i class="fa-solid fa-minus"></i>
              </a>
              [ [[${cart.quantity}]] ]
              <a th:href="@{'/user/cartQuantityUpdate?symbol=increase&cid='+${cart.id}}">
                <i class="fa-solid fa-plus"></i>
              </a>
            </td>
            <td>[[${cart.totalPrice}]]</td>
          </tr>
          <tr>
              <td colspan="4"></td>
              <td class="fw-bold">Total Price</td>
              <td class="fw-bold">[[${totalOrderPrice}]]</td>
          </tr>
          </tbody>
        </table>
        <div class="text-center">
          <a href="#" class="btn btn-primary">Proceed Payment</a>
        </div>
      </div>
    </div>
  </div>
</section>

<div th:replace="~{base::footer}"></div>
</body>
<script th:replace="~{base::jsb1}"></script>
</html>

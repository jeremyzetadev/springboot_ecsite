<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeLeaf.org"> <!-- th:replace="base::Layout(content)" -->
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link th:replace="~{base::bootstrap}" rel="stylesheet" href="">
    <link th:replace="~{base::fontawesome}" rel="stylesheet" href="">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav th:replace="~{base::nav}">THIS IS LOGIN NAV</nav>

<section>
    <div class="container mt-5 p-5">
        <form action="/user/save-order" method="post">
        <div class="row">
                <div class="col-md-6">
                    <p class="text-center fs-4">Billing Address</p>
                    <hr>
                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>FirstName:</label>
                            <input type="text" name="firstName" required class="form-control mt-1">
                        </div>
                        <div class="col p-1">
                            <label>LastName:</label>
                            <input type="text" name="lastName" required class="form-control mt-1">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Email:</label>
                            <input type="email" name="email" required class="form-control mt-1">
                        </div>
                        <div class="col p-1">
                            <label>MobileNo:</label>
                            <input type="text" name="mobileNo" required class="form-control mt-1">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>Address:</label>
                            <input type="text" name="address" required class="form-control mt-1">
                        </div>
                        <div class="col p-1">
                            <label>City:</label>
                            <input type="text" name="city" required class="form-control mt-1">
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <div class="col p-1">
                            <label>State:</label>
                            <input type="text" name="state" required class="form-control mt-1">
                        </div>
                        <div class="col p-1">
                            <label>Pincode:</label>
                            <input type="number" name="pincode" required class="form-control mt-1">
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <p class="text-center fs-4">Payment Type</p>
                    <hr>
                    <div class="card mt-5 p-1">
                        <div class="card-body">
                            <table class="table table-borderless">
                                <tbody>
                                <tr>
                                    <td>Total price</td>
                                    <td>:</td>
                                    <td>32453</td>
                                </tr>
                                <tr>
                                    <td>Delivery Fee</td>
                                    <td>:</td>
                                    <td>250</td>
                                </tr>
                                <tr>
                                    <td>Tax</td>
                                    <td>:</td>
                                    <td>100</td>
                                </tr>
                                <tr class="border-2">
                                    <td>Total Price</td>
                                    <td>:</td>
                                    <td>8392483</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card shadow p-3 mt-5 bg-body-tertiary rounded">
                        <div class="card-body">
                            <!--                        <form action="/login" method="post">-->
                            <div class="mb-3">
                                <label class="form-label">Select Payment Type</label>
                                <select required name="paymentType" class="form control">
                                    <option>--select--</option>
                                    <option value="COD">Cash on Delivery</option>
                                    <option value="ONLINE">Online Payment</option>
                                </select>
                            </div>
                            <button type="submit" class="btn bg-primary text-white col-md-12">Place Order</button>
                            <!--                        </form>-->
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>

<div th:replace="~{base::footer}"></div>
</body>
<script th:replace="~{base::jsb1}"></script>
</html>
